<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Background gradasi merah-oranye, animasi halus */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f12711, #f5af19);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Container tanpa kotak putih */
        .container {
            max-width: 420px;
            width: 100%;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-img:hover {
            transform: scale(1.05) rotate(3deg);
        }

        /* Nama */
        h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
        }

        /* Deskripsi */
        p {
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 30px;
            opacity: 0.95;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
        }

        /* Grup tombol */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 280px;
            margin: 0 auto;
        }

        /* Gaya tombol glassmorphism */
        .btn {
            display: inline-block;
            padding: 13px 22px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.35);
        }

        .btn-ig {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: white;
        }

        .btn-ig:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-sapa {
            background: white;
            color: #f12711;
            border: 2px solid white;
        }

        .btn-sapa:hover {
            background: transparent;
            color: white;
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn i {
            margin-right: 8px;
        }

        /* Responsif HP */
        @media (max-width: 480px) {
            h1 { font-size: 24px; }
            p { font-size: 14px; }
            .profile-img { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ganti link gambar profil kamu di sini -->
        <img src="https://i.pinimg.com/736x/8f/1c/a2/8f1ca2c4c5c1c5c1c5c1c5c1c5c1c5c1.jpg" alt="Foto Profil" class="profile-img">
        
        <h1>Nama Lengkap Saya</h1>
        
        <p>Siswa SMA yang tertarik dengan teknologi dan desain. Selamat datang di website pertama saya!</p>
        
        <div class="button-group">
            <a href="https://instagram.com/username_kamu" target="_blank" class="btn btn-ig">
                <i class="fab fa-instagram"></i> Kunjungi Instagram
            </a>
            
            <a href="https://wa.me/628123456789" target="_blank" class="btn btn-sapa">
                <i class="fas fa-paper-plane"></i> Sapa Saya!
            </a>
        </div>
    </div>

</body>
</html>
