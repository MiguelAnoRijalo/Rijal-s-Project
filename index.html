<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - Estetik</title>
    <!-- Mengambil Font dari Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Ikon FontAwesome (untuk ikon Instagram jika mau) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Reset Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Background Estetik */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f12711, #f5af19); /* Gradasi Merah ke Oranye */
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Animasi Background */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Kartu Putih (Card) */
        .card {
            background: rgba(255, 255, 255, 0.95); /* Putih sedikit transparan */
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25); /* Bayangan Lembut */
            text-align: center;
            max-width: 400px;
            width: 100%;
            
            /* Animasi Muncul */
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Container Foto Profil */
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            display: block;
            border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(241, 39, 17, 0.3);
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.05) rotate(3deg); /* Efek interaktif */
        }

        /* Judul Nama */
        h1 {
            color: #333;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        /* Deskripsi */
        p {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Grup Tombol */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Gaya Tombol Umum */
        .btn {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        /* Tombol Instagram (Warna Gradient Khas IG) */
        .btn-ig {
            background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045);
            color: white;
            box-shadow: 0 4px 15px rgba(253, 29, 29, 0.3);
        }

        .btn-ig:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(253, 29, 29, 0.5);
        }

        /* Tombol Sapa Saya (Warna Solid) */
        .btn-sapa {
            background-color: #333;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-sapa:hover {
            background-color: #000;
            transform: translateY(-3px);
        }

        /* Ikon di dalam tombol */
        .btn i {
            margin-right: 8px;
        }

        /* Responsif untuk HP */
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- GANTI LINK GAMBAR DI BAWAH INI -->
        <img src="https://i.pinimg.com/736x/8f/1c/a2/8f1ca2c4c5c1c5c1c5c1c5c1c5c1c5c1.jpg" alt="Foto Profil" class="profile-img">
        
        <h1>Nama Lengkap Saya</h1>
        
        <p>Siswa SMA yang tertarik dengan teknologi dan desain. Selamat datang di website pertama saya!</p>
        
        <div class="button-group">
            <!-- Ganti Link Instagram Kamu -->
            <a href="https://instagram.com/username_kamu" target="_blank" class="btn btn-ig">
                <i class="fab fa-instagram"></i> Kunjungi Instagram
            </a>
            
            <!-- Ganti Link WhatsApp/Email Kamu -->
            <a href="https://wa.me/628123456789" target="_blank" class="btn btn-sapa">
                <i class="fas fa-paper-plane"></i> Sapa Saya!
            </a>
        </div>
    </div>

</body>
</html>
