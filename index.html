<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f12711, #f5af19);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            color: white; /* Teks putih agar kontras dengan background */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Container utama tanpa background putih */
        .container {
            max-width: 500px;
            width: 100%;
            
            /* Animasi muncul */
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Foto Profil */
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 25px;
            display: block;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.05) rotate(3deg);
        }

        /* Judul Nama */
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2); /* Sedikit bayangan agar teks terbaca */
        }

        /* Deskripsi */
        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 35px;
            opacity: 0.95;
        }

        /* Grup Tombol */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 300px;
            margin: 0 auto;
        }

        /* Gaya Tombol (Glassmorphism style) */
        .btn {
            display: inline-block;
            padding: 14px 24px;
            border-radius: 50px; /* Tombol bulat penuh */
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px); /* Efek kaca */
        }

        /* Tombol Instagram */
        .btn-ig {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .btn-ig:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* Tombol Sapa (Warna Solid Putih) */
        .btn-sapa {
            background: white;
            color: #f12711;
            border: 2px solid white;
        }

        .btn-sapa:hover {
            background: transparent;
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn i {
            margin-right: 8px;
        }

        /* Responsif */
        @media (max-width: 480px) {
            h1 { font-size: 26px; }
            p { font-size: 14px; }
            .profile-img { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ganti Link Gambar Kamu di sini -->
        <img src="https://i.pinimg.com/736x/8f/1c/a2/8f1ca2c4c5c1c5c1c5c1c5c1c5c1c5c1.jpg" alt="Foto Profil" class="profile-img">
        
        <h1>Nama Lengkap Saya</h1>
        
        <p>Siswa SMA yang tertarik dengan teknologi dan desain. Selamat datang di website pertama saya!</p>
        
        <div class="button-group">
            <!-- Ganti Link Instagram -->
            <a href="https://instagram.com/username_kamu" target="_blank" class="btn btn-ig">
                <i class="fab fa-instagram"></i> Kunjungi Instagram
            </a>
            
            <!-- Ganti Link WhatsApp -->
            <a href="https://wa.me/628123456789" target="_blank" class="btn btn-sapa">
                <i class="fas fa-paper-plane"></i> Sapa Saya!
            </a>
        </div>
    </div>

</body>
</html>
